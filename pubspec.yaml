name: hongguo_studio
description: A borderless desktop and Android short drama assembly workspace.
publish_to: none
version: 0.3.3+12
environment:
  sdk: ^3.10.0
dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  pointycastle: ^4.0.0
  http: ^1.6.0
  file_picker: 10.3.10
  path_provider: ^2.1.6
  path: ^1.9.1
  package_info_plus: 9.0.1
  url_launcher: ^6.3.3
  window_manager: ^0.5.2
  ffmpeg_kit_flutter_new: ^4.6.7
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: 1.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/protocol/
    - licenses/
    - THIRD_PARTY_NOTICES.md

# Newer Android provider uses a JNI native asset that also links a JVM on Windows.
dependency_overrides:
  path_provider_android: 2.2.22
